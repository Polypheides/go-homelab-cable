<!DOCTYPE html>
<html>
    <head>
        <title>GoCable Remote</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="mobile-web-app-capable" content="yes">
        <link rel="manifest" href="/manifest.json">
        <link rel="icon" type="image/png" href="/icon-192.png">
        <link rel="apple-touch-icon" href="/icon-192.png">
        <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
        <link rel="stylesheet" href="styles.css"/>
        <link rel="stylesheet" href="remote.css"/>
        <script src="https://unpkg.com/htmx.org@1.9.7"></script>
        <script src="https://unpkg.com/idiomorph/dist/idiomorph-ext.min.js"></script>
    </head>
    <body hx-ext="morph">
        <section class="remote-rack" 
                 hx-get="/htmx/remote_status" 
                 hx-trigger="load, every 5s, refreshStatus from:body" 
                 hx-swap="morph" 
                 hx-on::after-settle="document.fonts.ready.then(() => checkOverflow())">
            <!-- Dynamic Remote UI will be injected here -->
        </section>

        <script>
            document.addEventListener('click', (e) => {
                const metal = e.target.closest('.metal');
                if (metal && navigator.vibrate) {
                    navigator.vibrate(40);
                }
            });

            window.cableState = window.cableState || {};
            window.cableAnims = window.cableAnims || {};
            window.cableStartTimes = window.cableStartTimes || {};

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js');
                });
            }

            function checkOverflow() {
                const lcd = document.getElementById('status-lcd-live');
                if (!lcd) return;

                const id = lcd.getAttribute('data-id');
                const playing = lcd.getAttribute('data-playing');
                const content = lcd.querySelector('.lcd-content');
                const text = content.querySelector('.lcd-text');
                
                if (!text) return;

                const threshold = 5; 
                const paddingOffset = 40; // LCD has 20px left/right padding
                const maxScroll = (text.scrollWidth - lcd.clientWidth) + paddingOffset;
                const needsScroll = maxScroll > paddingOffset + threshold;

                if (window.cableState[id] !== playing) {
                    if (window.cableAnims[id]) {
                        window.cableAnims[id].cancel();
                        delete window.cableAnims[id];
                    }
                    window.cableState[id] = playing;
                    window.cableStartTimes[id] = Date.now();
                }
                
                if (needsScroll) {
                    content.classList.add('scrolling');
                    
                    if (window.cableAnims[id] && window.cableAnims[id].playState === 'running') {
                        return; 
                    }

                    const pixelsPerSecond = 60; 
                    const pauseTime = 2000;      
                    const scrollTime = (maxScroll / pixelsPerSecond) * 1000;
                    const totalTime = pauseTime + (scrollTime * 2);

                    const p1 = pauseTime / totalTime;
                    const p2 = (pauseTime + scrollTime) / totalTime;

                    const keyframes = [
                        { transform: 'translateX(0)', offset: 0 },
                        { transform: 'translateX(0)', offset: p1 },
                        { transform: 'translateX(-' + (maxScroll + 15) + 'px)', offset: p2 },
                        { transform: 'translateX(0)', offset: 1 }
                    ];

                    const anim = content.animate(keyframes, {
                        duration: totalTime,
                        iterations: Infinity,
                        easing: 'linear'
                    });

                    const elapsed = (Date.now() - window.cableStartTimes[id]) % totalTime;
                    anim.currentTime = elapsed;
                    
                    window.cableAnims[id] = anim;
                } else {
                    content.classList.remove('scrolling');
                    if (window.cableAnims[id]) {
                        window.cableAnims[id].cancel();
                        delete window.cableAnims[id];
                    }
                }
            }
        </script>
    </body>
</html>
